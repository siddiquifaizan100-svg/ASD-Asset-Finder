<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASD Asset Finder</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#123a63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="ASD%20MEP%20Asset%20Finder%20App%20Icon.png">

  <style>
    <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f6fa;
    color: #172033;
  }

  .header {
    background: linear-gradient(135deg, #0d3155, #174d7d);
    color: white;
    padding: 20px 18px 24px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
  }

  .brand-row {
    max-width: 700px;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
  }

  .logo-box {
    width: 105px;
    height: 72px;
    background: white;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 7px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }

  .logo-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .header-title {
    flex: 1;
    text-align: center;
  }

  .header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
  }

  .header p {
    margin: 7px 0 0;
    font-size: 16px;
    opacity: 0.9;
  }

  .container {
    max-width: 700px;
    margin: 28px auto;
    padding: 0 16px;
  }

  .box {
    background: white;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(25,45,75,0.08);
    border: 1px solid #e8edf4;
  }

  .login-title {
    text-align: center;
    color: #123f69;
    margin: 0 0 8px;
  }

  .login-subtitle {
    text-align: center;
    color: #64748b;
    margin: 0 0 25px;
  }

  label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
    color: #172033;
  }

  select,
  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 19px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 16px;
    background: white;
    outline: none;
    transition: 0.2s;
  }

  select:focus,
  input:focus {
    border-color: #174d7d;
    box-shadow: 0 0 0 3px rgba(23,77,125,0.10);
  }

  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #123f69;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  button:hover {
    background: #0d3155;
  }

  .app-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    background: white;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #e5eaf0;
  }

  .logged-user {
    font-size: 13px;
    color: #64748b;
    overflow-wrap: anywhere;
  }

  .logout-btn {
    width: auto;
    min-width: 80px;
    padding: 9px 14px;
    background: #fff;
    color: #123f69;
    border: 1px solid #cbd5e1;
  }

  #loginMessage,
  #message {
    text-align: center;
    margin: 18px 0;
    font-weight: 700;
  }

  .error {
    color: #b91c1c;
  }

  .success {
    color: #15803d;
  }

  .asset-card {
    background: white;
    margin-top: 15px;
    padding: 20px;
    border-radius: 13px;
    border-left: 5px solid #174d7d;
    box-shadow: 0 3px 14px rgba(0,0,0,0.07);
  }

  .asset-card h3 {
    margin: 0 0 14px;
    color: #123f69;
    font-size: 19px;
  }

  .asset-card p {
    margin: 8px 0;
    line-height: 1.5;
  }

  .footer {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin: 32px 0;
  }

  #appSection,
  #loginSection {
    display: none;
  }

  @media (max-width: 600px) {
    .header {
      padding: 16px 12px 20px;
    }

    .brand-row {
      gap: 8px;
    }

    .logo-box {
      width: 75px;
      height: 58px;
      padding: 5px;
    }

    .header h1 {
      font-size: 23px;
    }

    .header p {
      font-size: 14px;
    }

    .container {
      margin-top: 18px;
    }

    .box {
      padding: 20px;
    }
  }
</style>
      </style>
</head>

<body>

  <div class="header">
   <div class="header">

  <div class="brand-row">

    <div class="logo-box">
      <img src="ASD%20LOGO.jpg" alt="American School of Doha">
    </div>

    <div class="header-title">
      <h1>ASD Asset Finder</h1>
      <p>American School of Doha</p>
    </div>

    <div class="logo-box">
      <img src="acciona%20logo%20new.png" alt="Acciona">
    </div>

  </div>

</div>
  </div>

  <div class="container">

    <!-- LOGIN -->
    <div id="loginSection">

      <div class="box">

        <h2 class="login-title">Authorized Access</h2>

        <p class="login-subtitle">
          Sign in to access ASD MEP assets
        </p>

        <label for="email">Email Address</label>

        <input
          id="email"
          type="email"
          placeholder="Enter your email"
          autocomplete="username"
        >

        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        >

        <button onclick="login()">
          Sign In
        </button>

        <div id="loginMessage"></div>

      </div>

    </div>


    <!-- ASSET FINDER -->
    <div id="appSection">

      <div class="app-toolbar">

        <div id="loggedUser" class="logged-user"></div>

        <button class="logout-btn" onclick="logout()">
          Logout
        </button>

      </div>

      <div class="box">

        <label for="category">Category</label>

        <select id="category">
          <option value="">Select Category</option>
        </select>

        <label for="room">Room Number</label>

        <input
          id="room"
          type="text"
          placeholder="Enter room number"
          autocomplete="off"
        >

        <button onclick="searchAssets()">
          Search Asset
        </button>

      </div>

      <div id="message"></div>

      <div id="results"></div>

    </div>

    <div class="footer">
      ASD MEP Asset Management
    </div>

  </div>


<script>

const SUPABASE_URL =
  "https://vywbhpdfnlprvfrmojxy.supabase.co";

/*
  IMPORTANT:
  Replace the text below with your existing
  Supabase PUBLISHABLE key only.
  Do NOT use service_role or secret key.
*/

const SUPABASE_KEY =
  "sb_publishable_YWvWjEPsrc5gzQk-52KMyw_vatHAgTS";


function getAccessToken() {
  return localStorage.getItem("asd_access_token");
}


function getRefreshToken() {
  return localStorage.getItem("asd_refresh_token");
}


function saveSession(session) {

  localStorage.setItem(
    "asd_access_token",
    session.access_token
  );

  localStorage.setItem(
    "asd_refresh_token",
    session.refresh_token
  );

  if (session.user && session.user.email) {
    localStorage.setItem(
      "asd_user_email",
      session.user.email
    );
  }
}


function clearSession() {

  localStorage.removeItem("asd_access_token");
  localStorage.removeItem("asd_refresh_token");
  localStorage.removeItem("asd_user_email");
}


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const loginMessage =
    document.getElementById("loginMessage");

  loginMessage.className = "";
  loginMessage.textContent = "";

  if (!email || !password) {

    loginMessage.className = "error";
    loginMessage.textContent =
      "Please enter email and password.";

    return;
  }

  loginMessage.textContent = "Signing in...";

  try {

    const response = await fetch(
      `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {

      throw new Error(
        data.error_description ||
        data.msg ||
        data.message ||
        "Invalid email or password."
      );
    }

    saveSession(data);

    showApp();

  } catch (error) {

    loginMessage.className = "error";
    loginMessage.textContent =
      error.message || "Unable to sign in.";

  }
}


async function refreshSession() {

  const refreshToken = getRefreshToken();

  if (!refreshToken) {
    return false;
  }

  try {

    const response = await fetch(
      `${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          refresh_token: refreshToken
        })
      }
    );

    if (!response.ok) {
      clearSession();
      return false;
    }

    const data = await response.json();

    saveSession(data);

    return true;

  } catch (error) {

    clearSession();
    return false;

  }
}


async function validateSession() {

  let accessToken = getAccessToken();

  if (!accessToken) {
    return false;
  }

  try {

    let response = await fetch(
      `${SUPABASE_URL}/auth/v1/user`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${accessToken}`
        }
      }
    );

    if (response.ok) {

      const user = await response.json();

      if (user.email) {
        localStorage.setItem(
          "asd_user_email",
          user.email
        );
      }

      return true;
    }

    const refreshed = await refreshSession();

    if (!refreshed) {
      return false;
    }

    accessToken = getAccessToken();

    response = await fetch(
      `${SUPABASE_URL}/auth/v1/user`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${accessToken}`
        }
      }
    );

    return response.ok;

  } catch (error) {

    return false;

  }
}


function showLogin() {

  document.getElementById("loginSection").style.display =
    "block";

  document.getElementById("appSection").style.display =
    "none";
}


async function showApp() {

  document.getElementById("loginSection").style.display =
    "none";

  document.getElementById("appSection").style.display =
    "block";

  const email =
    localStorage.getItem("asd_user_email") || "";

  document.getElementById("loggedUser").textContent =
    email ? "Signed in: " + email : "";

  await loadCategories();
}


async function logout() {

  const accessToken = getAccessToken();

  if (accessToken) {

    try {

      await fetch(
        `${SUPABASE_URL}/auth/v1/logout`,
        {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              `Bearer ${accessToken}`
          }
        }
      );

    } catch (error) {
      // Local logout will still continue.
    }
  }

  clearSession();

  document.getElementById("results").innerHTML = "";
  document.getElementById("message").textContent = "";

  showLogin();
}


async function authorizedFetch(url, options = {}) {

  let accessToken = getAccessToken();

  if (!accessToken) {
    throw new Error("Please sign in again.");
  }

  options.headers = {
    ...(options.headers || {}),
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${accessToken}`
  };

  let response = await fetch(url, options);

  if (response.status === 401) {

    const refreshed = await refreshSession();

    if (!refreshed) {

      clearSession();
      showLogin();

      throw new Error("Session expired. Please sign in again.");
    }

    accessToken = getAccessToken();

    options.headers["Authorization"] =
      `Bearer ${accessToken}`;

    response = await fetch(url, options);
  }

  return response;
}


async function loadCategories() {

  const categorySelect =
    document.getElementById("category");

  const message =
    document.getElementById("message");

  categorySelect.innerHTML =
    '<option value="">Select Category</option>';

  try {

    const response = await authorizedFetch(
      `${SUPABASE_URL}/rest/v1/rpc/get_asset_categories`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: "{}"
      }
    );

    if (!response.ok) {
      throw new Error("Unable to load categories.");
    }

    const data = await response.json();

    data.forEach(item => {

      const option =
        document.createElement("option");

      option.value = item.category;
      option.textContent = item.category;

      categorySelect.appendChild(option);

    });

  } catch (error) {

    message.className = "error";
    message.textContent = error.message;

  }
}


async function searchAssets() {

  const category =
    document.getElementById("category").value;

  const room =
    document.getElementById("room").value.trim();

  const message =
    document.getElementById("message");

  const results =
    document.getElementById("results");

  results.innerHTML = "";
  message.className = "";
  message.textContent = "";

  if (!category) {

    message.className = "error";
    message.textContent =
      "Please select a category.";

    return;
  }

  if (!room) {

    message.className = "error";
    message.textContent =
      "Please enter a room number.";

    return;
  }

  message.textContent = "Searching...";

  try {

    const url =
      `${SUPABASE_URL}/rest/v1/assets` +
      `?select=id,category,room_number,asset_type,result_1,result_2,result_3` +
      `&category=eq.${encodeURIComponent(category)}` +
      `&room_number=ilike.${encodeURIComponent(room)}` +
      `&order=asset_type.asc`;

    const response =
      await authorizedFetch(url);

    if (!response.ok) {
      throw new Error("Unable to search assets.");
    }

    const assets =
      await response.json();

    if (assets.length === 0) {

      message.textContent =
        "No assets found for this room and category.";

      return;
    }

    message.className = "success";
    message.textContent =
      `${assets.length} asset(s) found`;

    assets.forEach(asset => {

      const card =
        document.createElement("div");

      card.className = "asset-card";

      const title =
        document.createElement("h3");

      title.textContent =
        asset.asset_type || "Asset";

      card.appendChild(title);

      addField(
        card,
        "Room Number",
        asset.room_number
      );

      addField(
        card,
        "Result 1",
        asset.result_1
      );

      addField(
        card,
        "Result 2",
        asset.result_2
      );

      addField(
        card,
        "Result 3",
        asset.result_3
      );

      results.appendChild(card);

    });

  } catch (error) {

    message.className = "error";
    message.textContent =
      error.message ||
      "Unable to search assets.";

  }
}


function addField(card, label, value) {

  if (
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ) {
    return;
  }

  const row =
    document.createElement("p");

  const strong =
    document.createElement("strong");

  strong.textContent = label + ": ";

  row.appendChild(strong);

  row.appendChild(
    document.createTextNode(value)
  );

  card.appendChild(row);
}


document
  .getElementById("room")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        searchAssets();
      }

    }
  );


document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        login();
      }

    }
  );


async function initializeApp() {

  const valid =
    await validateSession();

  if (valid) {
    await showApp();
  } else {
    clearSession();
    showLogin();
  }
}


initializeApp();

</script>

</body>
</html>
